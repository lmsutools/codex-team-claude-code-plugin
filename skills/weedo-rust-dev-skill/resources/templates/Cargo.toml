# Workspace root, generated by weedo-rust-dev-skill (scaffold_workspace.sh).
# Layering: domain -> app (ports) -> adapters + platform (siblings) -> thin binary.
# Keep the graph WIDE and SHALLOW (depth <= 4) so Cargo can use every core.

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["apps/{{NAME}}"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "{{RUST_VERSION}}"
publish = false
license = "UNLICENSED"

# All shared dependency versions live here; members use `dep = { workspace = true }`.
# Turn off default features for heavy crates and enable only what each crate needs.
[workspace.dependencies]
# internal crates
{{NAME}}-domain = { path = "crates/domain" }
{{NAME}}-app = { path = "crates/app" }
{{NAME}}-platform = { path = "crates/platform" }
{{NAME}}-store-memory = { path = "crates/store-memory" }
{{NAME}}-test-support = { path = "crates/test-support" }

# third-party (minimal starter set)
anyhow = "1"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

# Add as needed (keep heavy ones isolated in a single crate each):
# tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
# axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# serde = { version = "1", default-features = false, features = ["std", "derive"] }
# async-trait = "0.1"             # only for async traits used through `dyn`
# windows-sys = { version = "0.61", features = [] }   # target-scoped in crates/platform
# objc2-foundation = "0.3"                          # target-scoped in crates/platform

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
large_futures = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# ---------------------------------------------------------------------------
# Profiles: fast dev loop, parallel release, separate heavy `dist`.
# ---------------------------------------------------------------------------
[profile.dev]
debug = "line-tables-only"     # file:line backtraces; far less to generate and link

[profile.dev.package."*"]      # third-party deps
debug = false
# opt-level = 1                # uncomment if dev binaries are too slow at runtime

[profile.debugging]            # real debugger sessions: cargo build --profile debugging
inherits = "dev"
debug = true

[profile.ci]                   # one-shot CI builds
inherits = "dev"
incremental = false
debug = false

[profile.release]
lto = "thin"                   # codegen-units stays 16 (parallel)

[profile.dist]                 # shipped artifacts only: cargo build --profile dist
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
